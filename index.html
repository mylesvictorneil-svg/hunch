<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hunch — Daily Guessing Games</title>
<script>
  // Apply the saved theme (or the device setting) before anything draws, so there's no flash.
  (function(){var t=null;try{t=localStorage.getItem("hunch:theme");}catch(e){}
    if(t)t=JSON.parse(t);if(t!=="dark"&&t!=="light")t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
    document.documentElement.dataset.theme=t;})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141414; --on-ink:#fff; --muted:#6c6a66; --text2:#3c3a36; --line:#e4e1da; --bg:#faf8f3; --card:#fff;
    --soft:#f1eee6; --field:#fff; --field-line:#cfcbc2; --placeholder:#9a978f; --empty:#c2bfb7; --locked:#e8e5dd;
    --overlay:rgba(20,20,20,.45); --shadow:rgba(0,0,0,.08);
    --green:#5fa463; --yellow:#d1b448; --gray:#a3a19c; --red:#d9604c; --gold:#F2C14E;
    --serif:"Fraunces", Georgia, serif; --sans:"DM Sans", system-ui, -apple-system, sans-serif;
    color-scheme:light;
  }
  [data-theme="dark"]{
    --ink:#f1eee7; --on-ink:#141414; --muted:#a29e95; --text2:#d3cfc6; --line:#33312d; --bg:#141312; --card:#1e1d1b;
    --soft:#262422; --field:#1a1917; --field-line:#4a4741; --placeholder:#77736b; --empty:#4f4c46; --locked:#3a3834;
    --overlay:rgba(0,0,0,.62); --shadow:rgba(0,0,0,.4);
    --gray:#6b6965;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  body{transition:background .2s,color .2s}
  a{color:inherit}
  button{font-family:inherit;cursor:pointer;color:inherit}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
  .logo{font-family:var(--serif);font-weight:800;font-size:24px;text-decoration:none;letter-spacing:-.5px}
  .logo span{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);margin-left:2px;vertical-align:2px}
  .top-r{display:flex;align-items:center;gap:8px}
  .date{font-size:13px;color:var(--muted);font-weight:500;margin-right:6px}
  .tbtn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-weight:700;font-size:13px;text-decoration:none;transition:border-color .15s}
  .tbtn:hover,.tbtn.on{border-color:var(--ink)}
  .tbtn svg{width:17px;height:17px}
  .tbtn.icon{width:36px;padding:0;justify-content:center}
  main{max-width:1040px;margin:0 auto;padding:0 20px 60px}

  /* hub */
  .hero{text-align:center;padding:52px 0 34px}
  .hero h1{font-family:var(--serif);font-weight:800;font-size:clamp(44px,8vw,72px);margin:0;letter-spacing:-2px;line-height:1}
  .hero p{color:var(--muted);font-size:17px;margin:14px 0 0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;transition:transform .15s, box-shadow .15s}
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 26px var(--shadow)}
  .card .band{background:var(--c);height:118px;display:flex;align-items:center;justify-content:center}
  .card .band svg{width:58px;height:58px}
  .card .body{padding:18px 20px 20px;display:flex;flex-direction:column;flex:1}
  .card h2{font-family:var(--serif);font-weight:800;font-size:26px;margin:0;letter-spacing:-.5px}
  .card .tag{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:3px}
  .card p{margin:10px 0 18px;color:var(--text2);line-height:1.45;font-size:15px;flex:1}
  .card .foot{display:flex;align-items:center;justify-content:space-between}
  .pill{display:inline-block;padding:9px 20px;border-radius:999px;background:var(--ink);color:var(--on-ink);font-weight:700;font-size:14px}
  .pill.done{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
  .num{font-size:13px;color:var(--muted)}
  .note{text-align:center;color:var(--muted);font-size:13px;margin-top:34px}

  /* game */
  .game{max-width:560px;margin:0 auto;padding-top:22px}
  .back{font-size:14px;font-weight:500;text-decoration:none;color:var(--muted)}
  .back:hover{color:var(--ink)}
  .ghead{display:flex;align-items:center;gap:14px;margin:18px 0 8px}
  .gicon{width:54px;height:54px;border-radius:12px;background:var(--c);display:flex;align-items:center;justify-content:center;flex:none}
  .gicon svg{width:32px;height:32px}
  .ghead h1{font-family:var(--serif);font-weight:800;font-size:32px;margin:0;letter-spacing:-.6px;line-height:1.05}
  .gsub{font-size:13px;color:var(--muted);font-weight:500;margin-top:2px}
  .how{font-size:14px;color:var(--text2);line-height:1.5;margin:8px 0 20px;padding:10px 14px;background:var(--soft);border-radius:10px}

  .cluelist{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:8px;counter-reset:c}
  .cluelist li{counter-increment:c;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px 12px 46px;position:relative;line-height:1.4;font-size:15px}
  .cluelist li::before{content:counter(c);position:absolute;left:14px;top:11px;width:22px;height:22px;border-radius:50%;background:var(--c);color:#141414;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
  .cluelist li.locked{color:var(--muted);background:transparent;border-style:dashed;font-size:13px}
  .cluelist li.locked::before{background:var(--locked);color:var(--muted)}

  .lot{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;gap:16px;margin-bottom:18px}
  .lot-emoji{font-size:44px;line-height:1;width:72px;height:72px;flex:none;border-radius:12px;background:color-mix(in srgb,var(--c) 35%,var(--card));display:flex;align-items:center;justify-content:center}
  .lot-title{font-family:var(--serif);font-weight:800;font-size:20px;line-height:1.15}
  .lot-meta{font-size:13px;color:var(--muted);margin-top:4px;font-weight:500}
  .lot p{margin:8px 0 0;font-size:14.5px;line-height:1.45;color:var(--text2)}

  .specs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
  .spec{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;min-height:68px}
  .spec .k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
  .spec .v{font-size:15px;margin-top:4px;line-height:1.3;font-weight:500}
  .spec.locked{background:transparent;border-style:dashed}
  .spec.locked .v{color:var(--muted);font-size:13px;font-weight:400}

  .rows{display:grid;gap:6px;margin-bottom:16px}
  .row{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;min-height:46px;border-radius:9px;padding:0 14px;font-weight:700;font-size:15px}
  .row .i{font-size:12px;opacity:.7}
  .row .n{font-size:13px;font-weight:500}
  .row.empty{border:1.5px solid var(--line);background:transparent;color:var(--empty)}
  .row.hit{background:var(--green);color:#fff}
  .row.close{background:var(--yellow);color:#fff}
  .row.miss{background:var(--gray);color:#fff}
  .row.far{background:var(--red);color:#fff}
  .row small{display:block;font-size:12px;font-weight:500;opacity:.92;margin-top:1px}
  .row:has(small){padding-top:7px;padding-bottom:7px}
  .row.hit .n,.row.bb .n{font-weight:700;font-size:14px}
  .row.bb{background:var(--gold);color:#141414}

  form.guess{display:flex;gap:8px}
  form.guess input{flex:1;min-width:0;font:inherit;font-size:17px;color:var(--ink);-webkit-text-fill-color:var(--ink);caret-color:var(--ink);opacity:1;padding:13px 15px;border:1.5px solid var(--field-line);border-radius:10px;background:var(--field);outline:none}
  form.guess input:focus{border-color:var(--ink)}
  form.guess input::placeholder{color:var(--placeholder);-webkit-text-fill-color:var(--placeholder)}
  .btn{border:0;background:var(--ink);color:var(--on-ink);font-weight:700;font-size:15px;padding:0 22px;border-radius:10px;min-height:48px}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
  .err{color:var(--red);font-size:13px;min-height:18px;margin-top:6px;font-weight:500}

  .answer{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;text-align:center;margin-bottom:12px}
  .answer-k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}
  .answer-v{font-family:var(--serif);font-weight:800;font-size:28px;margin-top:4px;letter-spacing:-.4px}
  .answer p{margin:8px 0 0;font-size:14px;color:var(--text2);line-height:1.45}
  .actions{display:flex;gap:8px}
  .actions .btn{flex:1}

  /* blockbuster */
  .bo-top{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;margin-bottom:10px;font-size:15px}
  .bo-top b{font-family:var(--serif);font-size:22px;margin-left:4px}
  .cluelist li.new{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
  .cluelist li.final{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
  .cluelist li.final::before{background:var(--gold);color:#141414}
  .bo-prompt{font-size:14px;line-height:1.5;margin:0 0 14px;color:var(--text2)}

  /* stats page */
  .stats-page{max-width:820px;margin:0 auto;padding-top:22px}
  .stats-page h1{font-family:var(--serif);font-weight:800;font-size:clamp(34px,6vw,48px);letter-spacing:-1px;margin:16px 0 4px}
  .stats-page .lede{color:var(--muted);margin:0 0 24px;font-size:15px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:22px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 12px;text-align:center}
  .tile b{display:block;font-family:var(--serif);font-weight:800;font-size:30px;line-height:1.1}
  .tile span{font-size:12px;color:var(--muted);font-weight:500}
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:28px}
  .rank{border-radius:14px;padding:16px 18px;display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line)}
  .rank .gicon{width:46px;height:46px}
  .rank .gicon svg{width:26px;height:26px}
  .rank .k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .rank .v{font-family:var(--serif);font-weight:800;font-size:22px;line-height:1.15}
  .rank .d{font-size:13px;color:var(--text2);margin-top:2px}
  .sec-h{font-family:var(--serif);font-weight:800;font-size:22px;margin:0 0 12px;letter-spacing:-.3px}
  .gstats{display:grid;gap:12px}
  .gs{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:start}
  .gs-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .gs-h .gicon{width:40px;height:40px;border-radius:10px}
  .gs-h .gicon svg{width:23px;height:23px}
  .gs-h h3{font-family:var(--serif);font-weight:800;font-size:21px;margin:0;line-height:1.1}
  .gs-h a{font-size:12px;color:var(--muted);font-weight:500}
  .mini{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:4px}
  .mini b{display:block;font-family:var(--serif);font-weight:800;font-size:22px}
  .mini span{font-size:11px;color:var(--muted);font-weight:500}
  .avg{margin-top:12px;font-size:13.5px;color:var(--text2);line-height:1.45}
  .avg b{color:var(--ink)}
  .dist-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
  .dist{display:grid;gap:5px}
  .bar{display:grid;grid-template-columns:22px 1fr;align-items:center;gap:8px;font-size:12px;font-weight:700}
  .bar i{display:flex;align-items:center;justify-content:flex-end;height:22px;border-radius:5px;background:var(--gray);min-width:24px;color:#fff;font-style:normal;padding:0 7px;font-size:12px;line-height:1}
  .bar i.top{background:var(--green)}
  .bar i.lose{background:var(--red)}
  .bar i.z{background:var(--locked);color:var(--muted)}
  .empty-note{color:var(--muted);font-size:13.5px;padding:8px 0}

  /* modal */
  .modal{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
  .modal[hidden]{display:none}
  .sheet{background:var(--card);border-radius:16px;max-width:420px;width:100%;padding:26px 24px 22px;position:relative;max-height:92vh;overflow:auto;animation:pop .2s ease-out}
  @keyframes pop{from{transform:translateY(12px);opacity:0}}
  .x{position:absolute;right:12px;top:10px;border:0;background:none;font-size:26px;line-height:1;color:var(--muted)}
  .sheet h3{font-family:var(--serif);font-weight:800;font-size:30px;margin:0;text-align:center;letter-spacing:-.5px}
  .sheet .sub{text-align:center;color:var(--muted);margin:6px 0 18px;font-size:15px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;margin-bottom:18px}
  .stats b{display:block;font-size:26px;font-family:var(--serif);font-weight:800}
  .stats span{font-size:11px;color:var(--muted);font-weight:500}
  .share{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:15px;white-space:pre-wrap;margin:0 0 10px;font-family:var(--sans);line-height:1.5}
  .next{text-align:center;color:var(--muted);font-size:13px;margin-top:14px}
  .next b{color:var(--ink);font-variant-numeric:tabular-nums}
  .next a{color:var(--ink);font-weight:700}
  .toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:9px 16px;border-radius:8px;font-size:14px;font-weight:500;z-index:30}

  /* ===== motion & 3D ===== */
  .bg-blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
  .bg-blobs i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(70px);opacity:.28;animation:drift 26s ease-in-out infinite alternate}
  [data-theme="dark"] .bg-blobs i{opacity:.13}
  .bg-blobs i:nth-child(1){background:#F2C14E;left:-12vmax;top:-14vmax}
  .bg-blobs i:nth-child(2){background:#AE96DE;right:-16vmax;top:10vh;animation-duration:32s;animation-delay:-8s}
  .bg-blobs i:nth-child(3){background:#6AA8EC;left:20vw;bottom:-22vmax;animation-duration:38s;animation-delay:-15s}
  .bg-blobs i:nth-child(4){background:#F27A62;right:10vw;bottom:-10vmax;width:30vmax;height:30vmax;animation-duration:29s;animation-delay:-4s}
  @keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6vmax,4vmax) scale(1.12)}100%{transform:translate(-4vmax,7vmax) scale(.94)}}
  body{background:transparent}
  html{background:var(--bg)}
  .top{background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .logo span{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.45);box-shadow:0 0 0 4px color-mix(in srgb,var(--red) 25%,transparent)}}

  /* hero */
  .hero{position:relative;padding:86px 0 70px;--mx:0;--my:0}
  .hero h1,.hero p,.hero .chip{position:relative;z-index:2}
  .hero h1 .ch{display:inline-block;animation:rise .8s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--i)*70ms)}
  .hero h1:hover .ch{animation:hop .5s ease both;animation-delay:calc(var(--i)*45ms)}
  @keyframes rise{from{transform:translateY(60%) rotate(8deg);opacity:0}}
  @keyframes hop{50%{transform:translateY(-14%)}}
  .hero p{animation:fadeUp .7s .45s ease both}
  .chip{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--muted);animation:fadeUp .7s .6s ease both}
  .chip b{color:var(--ink);font-variant-numeric:tabular-nums}
  .chip .live{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 var(--green);animation:ping 1.8s infinite}
  @keyframes ping{70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @keyframes fadeUp{from{transform:translateY(14px);opacity:0}}
  .stage{position:absolute;inset:0;pointer-events:none;z-index:1}
  .float{position:absolute;left:var(--x);top:var(--y);transform:translate3d(calc(var(--mx)*var(--z)*1px),calc(var(--my)*var(--z)*1px),0);transition:transform .5s cubic-bezier(.2,.8,.2,1);animation:fadeIn 1s calc(var(--k)*120ms + .2s) both}
  @keyframes fadeIn{from{opacity:0}}
  .bob{perspective:700px;animation:bob var(--b,6s) ease-in-out infinite;animation-delay:calc(var(--k)*-1.3s)}
  @keyframes bob{50%{transform:translateY(-16px)}}
  .cube{--h:calc(var(--s)/2);width:var(--s);height:var(--s);position:relative;transform-style:preserve-3d;animation:spin var(--d,14s) linear infinite;animation-delay:calc(var(--k)*-2.1s)}
  .cube .f{position:absolute;inset:0;border-radius:9px;background:var(--c);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
  .cube .f svg{width:58%;height:58%}
  .cube .f:nth-child(1){transform:translateZ(var(--h))}
  .cube .f:nth-child(2){transform:rotateY(180deg) translateZ(var(--h));filter:brightness(.82)}
  .cube .f:nth-child(3){transform:rotateY(90deg) translateZ(var(--h));filter:brightness(.9)}
  .cube .f:nth-child(4){transform:rotateY(-90deg) translateZ(var(--h));filter:brightness(.9)}
  .cube .f:nth-child(5){transform:rotateX(90deg) translateZ(var(--h));filter:brightness(1.08)}
  .cube .f:nth-child(6){transform:rotateX(-90deg) translateZ(var(--h));filter:brightness(.75)}
  @keyframes spin{from{transform:rotateX(var(--rx0,-20deg)) rotateY(0)}to{transform:rotateX(calc(var(--rx0,-20deg) + 360deg)) rotateY(360deg)}}
  .shadow{position:absolute;left:50%;top:calc(100% + 26px);width:calc(var(--s)*.9);height:12px;margin-left:calc(var(--s)*-.45);border-radius:50%;background:rgba(0,0,0,.14);filter:blur(5px);animation:shad var(--b,6s) ease-in-out infinite;animation-delay:calc(var(--k)*-1.3s)}
  [data-theme="dark"] .shadow{background:rgba(0,0,0,.5)}
  @keyframes shad{50%{transform:scale(.72);opacity:.6}}

  /* cards */
  .card{position:relative;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--lift,0px));transition:transform .25s ease-out, box-shadow .25s;animation:cardIn .7s cubic-bezier(.2,1,.3,1) both;animation-delay:calc(var(--n)*90ms + .25s)}
  .card:hover{--lift:-6px;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--lift))}
  @keyframes cardIn{from{transform:perspective(900px) translateY(40px) rotateX(14deg);opacity:0}}
  .card::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.38),transparent 55%);opacity:0;transition:opacity .25s;pointer-events:none;mix-blend-mode:soft-light}
  .card:hover::after{opacity:1}
  .card .band{position:relative;overflow:hidden}
  .card .band::before{content:"";position:absolute;inset:-50%;background:repeating-linear-gradient(45deg,rgba(255,255,255,.14) 0 14px,transparent 14px 28px);animation:stripes 9s linear infinite}
  .card:hover .band::before{animation-duration:2.5s}
  @keyframes stripes{to{transform:translate(39.6px,0)}}
  .card .band svg{position:relative;transition:transform .35s cubic-bezier(.2,1.4,.4,1)}
  .card:hover .band svg{transform:scale(1.18)}
  .pill{position:relative;overflow:hidden}
  .pill:not(.done)::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 3.6s ease-in-out infinite;animation-delay:calc(var(--n)*.4s + 1s)}
  [data-theme="dark"] .pill:not(.done)::after{background:linear-gradient(90deg,transparent,rgba(0,0,0,.18),transparent)}
  @keyframes shine{0%,60%{left:-60%}100%{left:130%}}

  /* living icons */
  .ic-era{animation:flip 4.5s ease-in-out infinite}
  @keyframes flip{0%,72%{transform:rotate(0)}86%,100%{transform:rotate(180deg)}}
  .ic-era .sand{animation:sand 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
  @keyframes sand{0%{transform:scaleY(.2)}70%{transform:scaleY(1)}100%{transform:scaleY(1)}}
  .ic-sold{transform-origin:72% 28%;animation:swing 3.2s ease-in-out infinite}
  @keyframes swing{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
  .ic-specs .needle{transform-box:view-box;transform-origin:24px 34px;animation:rev 2.8s cubic-bezier(.5,0,.3,1) infinite}
  @keyframes rev{0%{transform:rotate(-95deg)}45%{transform:rotate(8deg)}55%{transform:rotate(2deg)}62%{transform:rotate(10deg)}100%{transform:rotate(-95deg)}}
  .ic-blurred{animation:focus 3.4s ease-in-out infinite}
  @keyframes focus{0%,100%{filter:blur(2.2px);opacity:.7}40%,70%{filter:blur(0);opacity:1}}
  .ic-boxoffice{animation:wob 3s ease-in-out infinite}
  .ic-boxoffice .star{transform-box:fill-box;transform-origin:center;animation:twirl 3s ease-in-out infinite}
  @keyframes wob{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg) translateY(-2px)}}
  @keyframes twirl{0%,40%{transform:rotate(0) scale(1)}60%{transform:rotate(144deg) scale(1.3)}80%,100%{transform:rotate(144deg) scale(1)}}

  /* views & gameplay */
  #app>*{animation:viewIn .45s cubic-bezier(.2,.9,.3,1) both}
  @keyframes viewIn{from{opacity:0;transform:translateY(12px)}}
  #app.still *, #app.still>*{animation:none!important}
  .gicon{animation:iconIn .7s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes iconIn{from{transform:scale(.4) rotate(-25deg);opacity:0}}
  .rows{perspective:900px}
  .row.flip{animation:flipIn .6s cubic-bezier(.3,1.3,.5,1) both;transform-origin:center top}
  @keyframes flipIn{0%{transform:rotateX(-95deg);opacity:.3}100%{transform:none;opacity:1}}
  .row.flip.hit,.row.flip.bb{animation:flipIn .6s cubic-bezier(.3,1.3,.5,1) both, winPop .5s .55s ease both}
  @keyframes winPop{50%{transform:scale(1.04)}}
  .fresh{animation:freshIn .7s .25s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes freshIn{0%{transform:scale(.92);opacity:0;box-shadow:0 0 0 0 var(--c)}60%{box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 35%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
  .cluelist li.new.fresh{animation:freshIn .7s .25s cubic-bezier(.2,1.4,.4,1) both}
  .shake{animation:shake .45s ease}
  @keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
  .btn{transition:transform .12s, filter .15s}
  .btn:hover{filter:brightness(1.12)}
  .btn:active{transform:scale(.96)}
  .answer{animation:popIn .6s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes popIn{from{transform:scale(.85);opacity:0}}
  .sheet{animation:sheetIn .45s cubic-bezier(.2,1.4,.4,1)}
  @keyframes sheetIn{from{transform:translateY(24px) scale(.92);opacity:0}}
  .modal:not([hidden]){animation:fadeIn .25s ease both}
  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}

  /* stats motion */
  .tile,.rank,.gs{animation:fadeUp .6s cubic-bezier(.2,1,.3,1) both;animation-delay:calc(var(--n,0)*70ms)}
  .tile{transition:transform .2s}
  .tile:hover{transform:translateY(-3px)}
  .bar i{transform-origin:left center;animation:grow .9s cubic-bezier(.2,1,.3,1) both;animation-delay:calc(var(--n,0)*60ms + .3s)}
  @keyframes grow{from{transform:scaleX(0)}}

  @media (max-width:640px){
    .hero{padding:64px 0 46px}
    .float{--sm:1}
    .float.hide-sm{display:none}
    .float{top:calc(var(--y)*.5 + 34px)}
    .hero{padding-top:92px}
    .cube{width:calc(var(--s)*.62);height:calc(var(--s)*.62);--h:calc(var(--s)*.31)}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition:none!important}
  }

  @media (max-width:640px){
    .date{display:none}
    .gs{grid-template-columns:1fr}
    .duo{grid-template-columns:1fr}
  }
  @media (max-width:480px){
    .top{padding:10px 14px}
    .specs{grid-template-columns:1fr 1fr}
    .lot{flex-direction:column}
  }
</style>

function parseMoney(s){
  const m=s.toLowerCase().replace(/[$,\s]/g,"").match(/^(\d*\.?\d+)(k|thousand|m|mil|million|b|bn|billion)?$/);
  if(!m)return null; let v=parseFloat(m[1]); const u=m[2]||"";

function fx(board,fresh,err){
  if(err){const f=board.querySelector("form");if(f){f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake");}}
  if(fresh<0)return;
  const row=board.querySelectorAll(".rows .row")[fresh];if(row)row.classList.add("flip");
  if(!row||row.classList.contains("hit")||row.classList.contains("bb"))return;
  const open=board.querySelectorAll(".cluelist li:not(.locked), .specs .spec:not(.locked)");
  if(open.length>1)open[open.length-1].classList.add("fresh");
}
function confetti(colors,n=150){

    r:Math.random()*6,vr:(Math.random()-.5)*.35,w:7+Math.random()*7,h:5+Math.random()*6,c:colors[i%colors.length],dot:Math.random()<.28};});
  let t=0;cancelAnimationFrame(confetti.raf);
  const step=()=>{t++;g.clearRect(0,0,W,H);let alive=0;
    for(const p of P){p.vy+=.3;p.vx*=.986;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;if(p.y<H+30)alive++;
      g.save();g.translate(p.x,p.y);g.rotate(p.r);g.globalAlpha=Math.max(0,Math.min(1,(260-t)/60));g.fillStyle=p.c;
      if(p.dot){g.beginPath();g.arc(0,0,p.w/2.6,0,7);g.fill();}else g.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(t/7+p.r)));g.restore();}
    if(alive&&t<260)confetti.raf=requestAnimationFrame(step);else g.clearRect(0,0,W,H);};
  step();
}
function countUp(root){
  if(app.classList.contains("still")||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  root.querySelectorAll(".tile b,.mini b").forEach(el=>{
    const m=el.textContent.match(/^([\d,]+)(%?)$/);if(!m)return;const end=+m[1].replace(/,/g,""),suf=m[2];if(!end)return;
    const t0=performance.now(),dur=900;
    const f=now=>{const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=Math.round(end*e).toLocaleString()+suf;if(k<1)requestAnimationFrame(f);};
    requestAnimationFrame(f);
  });
}

function route(){
  closeModal();
  app.classList.remove("still");
  const h=location.hash.slice(1),g=GAMES.find(x=>x.id===h);
  document.getElementById("statsBtn").classList.toggle("on",h==="stats");
  if(h==="stats"){practice=null;renderStats();}
  else if(!g){practice=null;renderHub();}else{if(practice&&practice.id!==g.id)practice=null;renderGame(g);}
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
// Keep every open tab in sync: redraw when another tab saves progress, or when this tab comes back into view.
function refresh(){const t=store.get("theme",null);if(t==="dark"||t==="light")applyTheme(t);if(!modal.hidden)return;app.classList.add("still");const y=window.scrollY,h=location.hash.slice(1),g=GAMES.find(x=>x.id===h);if(h==="stats")renderStats();else if(!g)renderHub();else if(!practice)renderGame(g);window.scrollTo(0,y);}
window.addEventListener("storage",e=>{if(!e.key||e.key.startsWith("hunch:"))refresh();});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refresh();});

function renderGame(g){
  closeModal();
  const isP=!!practice;
  app.innerHTML=`<div class="game" style="--c:${g.color}">
    <a href="#" class="back">← All games</a>
    <div class="ghead"><div class="gicon">${IC[g.id]}</div><div><h1>${g.name}</h1><div class="gsub">${g.tag} · ${isP?"Practice round":"#"+PNUM}</div></div></div>
    <p class="how">${g.id==="boxoffice"?"Each round adds a criterion, and they get more specific. Name any movie that fits all of them to score, with later rounds worth more. Every day one movie, the Blockbuster, is what the criteria describe. Name it for a huge bonus, and the earlier you get it, the bigger the bonus.":DEFS[g.id].how}</p>
    <div id="board"></div></div>`;
  const board=document.getElementById("board");
  const ctx={g,practice:isP,key:g.id+":"+DAY,label:isP?"Practice":"#"+PNUM};
  if(g.id==="boxoffice"){boxOffice(board,ctx,isP?practice.idx:mod(DAY+g.off,BLOCKBUSTERS.length));return;}
  const def=DEFS[g.id];
  const idx=isP?practice.idx:mod(DAY+g.off,def.data.length);
  guessGame(board,def,def.data[idx],ctx,idx);
}

/* ============ GUESS ENGINE ============ */
function guessGame(board,def,p,ctx,idx){
  const MAX=def.max||6;
  let st=ctx.practice?{guesses:[],done:false,won:false}:store.get(ctx.key,{guesses:[],done:false,won:false});
  const save=()=>{if(!ctx.practice)store.set(ctx.key,st);};
  let fresh=-1;
  function render(err=""){
    const step=st.done?99:st.guesses.length;
    const rows=[];
    for(let i=0;i<MAX;i++){
      const v=st.guesses[i];
      if(v===undefined){rows.push(`<div class="row empty"><span class="i">${i+1}</span><span></span><span></span></div>`);continue;}
      const j=def.judge(v,p);
      rows.push(`<div class="row ${j.s}"><span class="i">${i+1}</span><span>${esc(def.label(v))}</span><span class="n">${esc(j.note)}</span></div>`);
    }
    const input=def.options?`<datalist id="opts">${def.options.map(o=>`<option value="${esc(o)}">`).join("")}</datalist>`:"";
    board.innerHTML=`${def.clues(p,step)}<div class="rows">${rows.join("")}</div>${st.done?`
      <div class="answer"><div class="answer-k">${st.won?"You got it":"The answer was"}</div><div class="answer-v">${esc(def.answer(p))}</div>${def.reveal?def.reveal(p):""}</div>
      <div class="actions"><button class="btn" data-a="res">See results</button><button class="btn ghost" data-a="prac">Practice another</button></div>`:`
      <form class="guess" autocomplete="off"><input id="gin" ${def.options?'list="opts"':""} inputmode="${def.inputmode||"text"}" placeholder="${esc(def.placeholder)}" aria-label="Your guess"><button class="btn" type="submit">Guess</button></form>${input}<div class="err">${esc(err)}</div>`}`;
    fx(board,fresh,err);fresh=-1;
    const f=board.querySelector("form");
    if(f){f.addEventListener("submit",onGuess);const inp=board.querySelector("#gin");if(st.guesses.length)inp.focus();}
    board.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
      if(b.dataset.a==="res")showResult();
      else{let n;do{n=Math.floor(Math.random()*def.data.length);}while(def.data.length>1&&n===idx);practice={id:ctx.g.id,idx:n};renderGame(ctx.g);window.scrollTo(0,0);}
    });
  }
  function onGuess(e){
    e.preventDefault();
    const raw=board.querySelector("#gin").value.trim();if(!raw)return;
    const r=def.parse(raw);if(r.error){render(r.error);board.querySelector("#gin").value=raw;return;}
    if(st.guesses.some(x=>def.label(x)===def.label(r.value))){render("You already guessed that.");return;}
    st.guesses.push(r.value);
    const j=def.judge(r.value,p);
    if(j.s==="hit"){st.done=true;st.won=true;}else if(st.guesses.length>=MAX){st.done=true;st.won=false;}
    fresh=st.guesses.length-1;save();render();
    if(st.won)confetti([ctx.g.color,"#5fa463","#F2C14E","#ffffff","#141414"]);
    if(st.done)setTimeout(showResult,st.won?1300:650);
  }
  function showResult(){
    const grid=st.guesses.map(v=>EMO[def.judge(v,p).s]).join("");
    const share=`Hunch ${ctx.g.name} ${ctx.label}  ${st.won?st.guesses.length:"X"}/${MAX}\n${grid}`;
    openModal(ctx.g,st.won?["Nice hunch!","Solved in "+st.guesses.length+(st.guesses.length===1?" guess":" guesses")]:["So close","The answer was "+def.answer(p)],share,ctx.practice);
  }
  render();
}

/* ============ BOX OFFICE ============ */
function boxOffice(board,ctx,idx){
  const P=BLOCKBUSTERS[idx],R=5,blank={guesses:[],done:false,found:false,score:0};
  let st=ctx.practice?{...blank}:store.get(ctx.key,{...blank});
  if(!Array.isArray(st.guesses))st={...blank};
  const save=()=>{if(!ctx.practice)store.set(ctx.key,st);};
  const bb=MOVIES.find(m=>m.name===P.movie);
  function judge(name,r){
    const m=MOVIES.find(x=>x.name===name),base=100*(r+1);
    if(name===P.movie)return{s:"bb",pts:base+BB_BONUS[r],note:"Blockbuster! Jackpot bonus"};
    if(r>=4)return{s:"miss",pts:0,note:"Not the Blockbuster"};
    const fail=P.rules.slice(0,r+1).find(rule=>!rule.test(m));
    return fail?{s:"miss",pts:0,note:"Doesn't fit: "+fail.label}:{s:"hit",pts:base,note:"Fits all the criteria"};
  }
  let fresh=-1;
  function render(err=""){
    const r=st.done?R:st.guesses.length;
    const crit=P.rules.map((rule,i)=>i<=r?`<li class="${i===r&&!st.done?"new":""}">${esc(rule.label)}</li>`:`<li class="locked">Unlocks in round ${i+1}</li>`).join("")
      +(r>=4?`<li class="final${!st.done?" new":""}"><b>Final clue:</b> ${esc(P.final)}</li>`:`<li class="locked">Final clue unlocks in round 5</li>`);
    const rows=[];
    for(let i=0;i<R;i++){
      const name=st.guesses[i];
      if(name===undefined){rows.push(`<div class="row empty"><span class="i">R${i+1}</span><span></span><span></span></div>`);continue;}
      const j=judge(name,i);
      rows.push(`<div class="row ${j.s}"><span class="i">R${i+1}</span><span>${j.s==="bb"?"🎬 ":""}${esc(name)}<small>${esc(j.note)}</small></span><span class="n">${j.pts?"+"+j.pts.toLocaleString():"0"}</span></div>`);
    }
    const prompt=r<4?`Name any movie that fits <b>every</b> criterion so far. Worth <b>${100*(r+1)}</b> points, or <b>${(100*(r+1)+BB_BONUS[r]).toLocaleString()}</b> if it's the Blockbuster.`
      :`Last round. Only the Blockbuster scores, worth <b>${(500+BB_BONUS[4]).toLocaleString()}</b> points.`;
    board.innerHTML=`
      <div class="bo-top"><span>${st.done?"Final":"Round "+(r+1)+" of "+R}</span><span>Score <b>${st.score.toLocaleString()}</b></span></div>
      <ol class="cluelist">${crit}</ol>
      ${st.done?"":`<p class="bo-prompt">${prompt}</p>`}
      <div class="rows">${rows.join("")}</div>
      ${st.done?`
        <div class="answer"><div class="answer-k">${st.found?"You found the Blockbuster":"The Blockbuster was"}</div><div class="answer-v">${esc(bb.name)}</div>
        <p>${bb.year} · directed by ${esc(bb.dir)} · about ${fmtGross(bb.g)} worldwide</p></div>
        <div class="actions"><button class="btn" data-a="res">See results</button><button class="btn ghost" data-a="prac">Practice another</button></div>`:`
        <form class="guess" autocomplete="off"><input id="gin" list="opts" placeholder="Start typing a movie…" aria-label="Your guess"><button class="btn" type="submit">Guess</button></form>
        <datalist id="opts">${MOVIES.map(m=>`<option value="${esc(m.name)}">`).join("")}</datalist><div class="err">${esc(err)}</div>`}`;
    fx(board,fresh,err);fresh=-1;
    const f=board.querySelector("form");
    if(f){f.addEventListener("submit",onGuess);if(st.guesses.length)board.querySelector("#gin").focus();}
    board.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
      if(b.dataset.a==="res")showResult();
      else{let n;do{n=Math.floor(Math.random()*BLOCKBUSTERS.length);}while(n===idx);practice={id:"boxoffice",idx:n};renderGame(ctx.g);window.scrollTo(0,0);}
    });
  }
  function onGuess(e){
    e.preventDefault();
    const raw=board.querySelector("#gin").value.trim();if(!raw)return;
    const m=MOVIE_KEYS[norm(raw)];
    if(!m){render("That movie isn't on the list. Pick one of the suggestions.");board.querySelector("#gin").value=raw;return;}
    if(st.guesses.includes(m.name)){render("You already used that movie. Each round needs a new one.");return;}
    const r=st.guesses.length,j=judge(m.name,r);
    st.guesses.push(m.name);st.score+=j.pts;
    if(j.s==="bb"){st.done=true;st.found=true;}else if(st.guesses.length>=R)st.done=true;
    fresh=st.guesses.length-1;save();render();
    if(j.s==="bb")confetti(["#F2C14E","#ffd970","#c9971c","#ffffff","#141414"],220);else if(j.s==="hit")confetti([ctx.g.color,"#5fa463","#ffffff"],40);
    if(st.done)setTimeout(showResult,st.found?1400:650);
  }
  function showResult(){
    const grid=st.guesses.map((n,i)=>({hit:"🟩",miss:"⬜",bb:"🎬"})[judge(n,i).s]).join("");
    openModal(ctx.g,st.found?["Blockbuster!",`Found in round ${st.guesses.length} · ${st.score.toLocaleString()} points`]:["No Blockbuster today",`It was ${bb.name} · you scored ${st.score.toLocaleString()} points`],
      `Hunch Blockbuster ${ctx.label}  ${st.score.toLocaleString()} pts\n${grid}`,ctx.practice);
  }
  render();
}

/* ============ MODAL ============ */
const modal=document.getElementById("modal"),sheet=document.getElementById("sheet");
let timer=null;
function openModal(g,[title,sub],share,isP){
  const s=gameStats(g.id);
  sheet.innerHTML=`<button class="x" aria-label="Close">×</button>
    <h3>${esc(title)}</h3><p class="sub">${esc(sub)}</p>

    <div class="stats"><div><b>${s.played}</b><span>Played</span></div><div><b>${s.pct}</b><span>Win %</span></div><div><b>${s.cur}</b><span>Streak</span></div><div><b>${s.best}</b><span>Best</span></div></div>
    <pre class="share" id="sharetxt">${esc(share)}</pre>
    <button class="btn" style="width:100%" id="copy">Copy results</button>
    <div class="next">Next puzzle in <b id="cd"></b> · <a href="#stats">All your stats</a></div>`;
  modal.hidden=false;
  sheet.querySelector(".x").onclick=closeModal;
  sheet.querySelector("#copy").onclick=()=>{
    const done=()=>toast("Copied to clipboard");
    const fallback=()=>{const sel=window.getSelection(),rg=document.createRange();rg.selectNodeContents(sheet.querySelector("#sharetxt"));sel.removeAllRanges();sel.addRange(rg);try{document.execCommand("copy")?done():toast("Text selected, copy it manually");}catch(e){toast("Text selected, copy it manually");}};
    try{navigator.clipboard.writeText(share).then(done,fallback);}catch(e){fallback();}
  };
  const tick=()=>{const n=new Date(),m=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1),d=Math.max(0,m-n);
    const el=document.getElementById("cd");if(el)el.textContent=[d/36e5,d/6e4%60,d/1e3%60].map(x=>String(Math.floor(x)).padStart(2,"0")).join(":");};
  tick();clearInterval(timer);timer=setInterval(tick,1000);
}
function closeModal(){modal.hidden=true;clearInterval(timer);}
modal.addEventListener("click",e=>{if(e.target===modal)closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});

/* ============ STATS ============ */
// Stats are worked out from every finished daily puzzle saved in this browser.
function allKeys(){
  const ks=new Set(Object.keys(mem));
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith("hunch:"))ks.add(k.slice(6));}}catch(e){}
  return[...ks];
}
const isWin=(id,st)=>id==="boxoffice"?!!st.found:!!st.won;
function records(id){
  const re=new RegExp("^"+id+":(\\d+)$");
  return allKeys().map(k=>k.match(re)).filter(Boolean)
    .map(m=>({day:+m[1],st:store.get(m[0],null)}))
    .filter(r=>r.st&&r.st.done&&Array.isArray(r.st.guesses)).sort((a,b)=>a.day-b.day);
}
function streaks(days,playedToday){
  const set=new Set(days);let cur=0,d=playedToday?DAY:DAY-1;while(set.has(d)){cur++;d--;}
  let best=0,run=0;[...set].sort((a,b)=>a-b).forEach((x,i,arr)=>{run=(i&&x===arr[i-1]+1)?run+1:1;best=Math.max(best,run);});
  return{cur,best};
}
function gameStats(id){
  const recs=records(id),max=id==="boxoffice"?5:(DEFS[id].max||6),wins=recs.filter(r=>isWin(id,r.st));
  const dist=Array(max).fill(0);let losses=0;
  recs.forEach(r=>isWin(id,r.st)?dist[Math.min(r.st.guesses.length,max)-1]++:losses++);
  const s=streaks(wins.map(r=>r.day),recs.some(r=>r.day===DAY));
  const out={id,played:recs.length,wins:wins.length,pct:recs.length?Math.round(wins.length/recs.length*100):0,cur:s.cur,best:s.best,dist,losses,max,
    avg:wins.length?wins.reduce((t,r)=>t+r.st.guesses.length,0)/wins.length:null};
  if(id==="boxoffice"&&recs.length){out.avgScore=Math.round(recs.reduce((t,r)=>t+(r.st.score||0),0)/recs.length);out.bestScore=Math.max(...recs.map(r=>r.st.score||0));}
  return out;
}
const UNIT={era:"guesses",sold:"guesses",specs:"guesses",blurred:"rounds",boxoffice:"rounds"};
function avgLine(g,s){
  if(!s.played)return"";
  if(g.id==="boxoffice")return`Average score <b>${s.avgScore.toLocaleString()}</b>, best <b>${s.bestScore.toLocaleString()}</b>. `+(s.avg?`You find the Blockbuster in round <b>${s.avg.toFixed(1)}</b> on average.`:`You haven't found a Blockbuster yet.`);
  return s.avg?`You solve it in <b>${s.avg.toFixed(1)}</b> ${UNIT[g.id]} on average.`:`No solves yet. Keep at it.`;
}
function renderStats(){
  const all=GAMES.map(g=>({g,s:gameStats(g.id)}));
  const dayMap={};all.forEach(({g})=>records(g.id).forEach(r=>{(dayMap[r.day]=dayMap[r.day]||[]).push(isWin(g.id,r.st));}));
  const days=Object.keys(dayMap).map(Number),ds=streaks(days,!!dayMap[DAY]);
  const perfect=days.filter(d=>dayMap[d].length===GAMES.length&&dayMap[d].every(Boolean)).length;
  const played=all.reduce((t,x)=>t+x.s.played,0),wins=all.reduce((t,x)=>t+x.s.wins,0);
  const doneToday=dayMap[DAY]?dayMap[DAY].length:0;
  const tile=(v,l)=>`<div class="tile"><b>${v}</b><span>${l}</span></div>`;
  // Best and toughest: win rate first, then fewer guesses (relative to the game's max).
  const ranked=all.filter(x=>x.s.played).sort((a,b)=>b.s.pct-a.s.pct||((a.s.avg??a.s.max+1)/a.s.max)-((b.s.avg??b.s.max+1)/b.s.max));
  const rankCard=(label,x)=>`<div class="rank" style="--c:${x.g.color}"><div class="gicon">${IC[x.g.id]}</div><div><div class="k">${label}</div><div class="v">${x.g.name}</div>
    <div class="d">${x.s.pct}% win rate${x.s.avg?` · ${x.s.avg.toFixed(1)} ${UNIT[x.g.id]} avg`:""} · ${x.s.played} played</div></div></div>`;
  const duo=ranked.length>=2?`<div class="duo">${rankCard("Your best game",ranked[0])}${rankCard("Your toughest game",ranked[ranked.length-1])}</div>`
    :`<p class="empty-note" style="margin:-8px 0 24px">Finish at least two different games to see your best and toughest game.</p>`;
  const gs=all.map(({g,s})=>{
    const top=Math.max(...s.dist,s.losses,1),mostIdx=s.dist.indexOf(Math.max(...s.dist));
    const bars=s.dist.map((n,i)=>`<div class="bar"><span>${i+1}</span><i class="${n?(i===mostIdx?"top":""):"z"}" style="width:${Math.max(8,n/top*100)}%">${n}</i></div>`).join("")
      +`<div class="bar"><span>✕</span><i class="${s.losses?"lose":"z"}" style="width:${Math.max(8,s.losses/top*100)}%">${s.losses}</i></div>`;
    return`<div class="gs" style="--c:${g.color}"><div>
      <div class="gs-h"><div class="gicon">${IC[g.id]}</div><div><h3>${g.name}</h3><a href="#${g.id}">Play today's puzzle →</a></div></div>
      <div class="mini"><div><b>${s.played}</b><span>Played</span></div><div><b>${s.pct}</b><span>Win %</span></div><div><b>${s.cur}</b><span>Streak</span></div><div><b>${s.best}</b><span>Best streak</span></div></div>
      <p class="avg">${s.played?avgLine(g,s):`You haven't finished a ${g.name} puzzle yet.`}</p></div>
      <div><div class="dist-h">${g.id==="boxoffice"?"Round you found the Blockbuster":g.id==="blurred"?"Rounds to solve":"Guesses to solve"}</div><div class="dist">${bars}</div></div></div>`;
  }).join("");
  app.innerHTML=`<div class="stats-page">
    <a href="#" class="back">← All games</a>
    <h1>Your stats</h1>
    <p class="lede">Every daily puzzle you finish counts. Practice rounds don't. Today: ${doneToday} of ${GAMES.length} games done.</p>
    <div class="tiles">${tile(days.length,"Days played")}${tile(ds.cur,"Day streak")}${tile(ds.best,"Best day streak")}${tile(wins,"Puzzles solved")}${tile(played?Math.round(wins/played*100)+"%":"–","Overall win rate")}${tile(perfect,"Perfect days")}</div>
    ${played?duo:""}
    <h2 class="sec-h">By game</h2>
    <div class="gstats">${gs}</div>
    <p class="note">A day streak counts days you finish at least one game. A perfect day means you solved all five.</p></div>`;
  app.querySelectorAll(".tile,.rank,.gs").forEach((el,i)=>el.style.setProperty("--n",i));
  app.querySelectorAll(".dist").forEach(d=>d.querySelectorAll(".bar i").forEach((el,i)=>el.style.setProperty("--n",i)));
  countUp(app);
}
